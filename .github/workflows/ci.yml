name: APEX ONE CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-and-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: apex_ci
          POSTGRES_PASSWORD: apex_ci_password
          POSTGRES_DB: apex_one_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]" -e ./local_node
      - name: Run Ruff static analysis
        run: ruff check backend local_node tests migrations
      - name: Verify Alembic PostgreSQL migrations & provision NOBYPASSRLS app role
        env:
          APEX_DATABASE_URL: postgresql+asyncpg://apex_ci:apex_ci_password@127.0.0.1:5432/apex_one_ci
          APEX_ADMIN_DSN: postgresql://apex_ci:apex_ci_password@127.0.0.1:5432/apex_one_ci
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["APEX_ADMIN_DSN"], autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      DO $$
                      BEGIN
                          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'apex_app') THEN
                              CREATE ROLE apex_app LOGIN PASSWORD 'apex_app_ci_password'
                                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
                          END IF;
                      END
                      $$;
                      """
                  )
                  cur.execute("GRANT CONNECT ON DATABASE apex_one_ci TO apex_app")
                  cur.execute("GRANT USAGE ON SCHEMA public TO apex_app")
                  cur.execute(
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO apex_app"
                  )
                  cur.execute(
                      "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO apex_app"
                  )
                  cur.execute(
                      "ALTER DEFAULT PRIVILEGES IN SCHEMA public "
                      "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO apex_app"
                  )
          PY
      - name: Run Full Pytest Suite (Unit + API + PostgreSQL Integration + RLS Security)
        env:
          APEX_DATABASE_URL: postgresql+asyncpg://apex_app:apex_app_ci_password@127.0.0.1:5432/apex_one_ci
        run: |
          set +e
          pytest -v --tb=short 2>&1 | tee /tmp/pytest_ci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            summary=$(grep -E "FAILED|ERROR|AssertionError|E   " /tmp/pytest_ci.log | head -n 20 | tr '\n' ' ')
            echo "::error title=Pytest Failure::${summary}"
            exit "$rc"
          fi

  frontend-and-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install npm workspace dependencies
        run: npm ci
      - name: Typecheck & Build Workspaces
        run: npm run typecheck && npm run build
      - name: Run Vitest Suite (Runtime + E2E UI)
        run: npm test
