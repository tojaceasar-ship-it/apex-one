[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-one-backend"
version = "1.0.0"
description = "APEX ONE 1.0 (Full Research Edition) — Multi-Agent AI Research, Evidence Graph, Experimentation, Evaluation & Governance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "redis>=5.2.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "websockets>=13.1,<15.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pypdf>=5.0.0,<8.0.0",
    "python-docx>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["apex_one", "apex_local_node", "tests"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "backend", "local_node"]
markers = [
    "unit: Suite A — Unit tests independent of PostgreSQL and external services",
    "api: Suite B — API & protocol tests using isolated test-only doubles",
    "pg_integration: Suite C — PostgreSQL integration tests requiring real PostgreSQL (DATABASE_URL / APEX_DATABASE_URL)",
    "pg_security: Suite D — PostgreSQL Row-Level Security (RLS) tests requiring real PostgreSQL",
]
