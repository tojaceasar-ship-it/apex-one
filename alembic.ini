[alembic]
script_location = migrations
prepend_sys_path = backend
version_path_separator = os

# URL is resolved dynamically in migrations/env.py from APEX_DATABASE_URL or DATABASE_URL.
# Never hardcode credentials in this file.
sqlalchemy.url = postgresql+psycopg://placeholder-configure-via-env/apex_one

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
