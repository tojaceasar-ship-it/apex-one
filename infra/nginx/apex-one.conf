# Reference Nginx TLS Reverse Proxy Configuration for APEX ONE Production
server {
    listen 443 ssl http2;
    server_name apex-one.example.org;

    # TLS certificates provisioned via ACME / enterprise PKI
    ssl_certificate     /etc/ssl/certs/apex-one-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/apex-one-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static React Workbench bundle
    root /var/www/apex-one-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI REST + SSE + Hybrid Local Node WebSocket Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
